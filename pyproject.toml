[project]
name = "download-speed"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lumpButton", email = "igropritegatel11@gmail.com" }
]
requires-python = ">=3.15"
dependencies = []

[project.scripts]
download-speed = "download_speed:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "A",       # flake8-builtins
    "C4",      # flake8-comprehensions
    "SIM",     # flake8-simplify
    "RET",     # flake8-return
    "PT",      # flake8-pytest-style
    "RUF",     # ruff-specific rules
]

[tool.mypy]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests"]
